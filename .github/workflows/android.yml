name: android
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unzip project
        run: unzip -o free2api_gateway.zip
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Collect errors
        if: failure()
        run: |
          {
            echo '```'
            grep -nE "error:|FAILURE|Caused by|\.java:[0-9]+" build.log | tail -60
            echo '```'
            echo '### log tail'
            echo '```'
            tail -30 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
