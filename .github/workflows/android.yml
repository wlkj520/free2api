name: android
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unzip project
        run: unzip -o free2api_gateway.zip
      - name: Patch readAllBytes
        run: sed -i '/readAllBytes/d' app/src/main/java/dev/free2api/service/GatewayService.java
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Collect errors
        if: failure()
        run: |
          {
            echo '```'
            grep -nE "error:|What went wrong|Caused by|FAILURE" build.log | head -80
            echo '```'
            echo '### user code refs'
            echo '```'
            grep -nE "\.java:[0-9]+" build.log | grep -v "org\.gradle" | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
